services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: eudora
      POSTGRES_USER: eudora
      POSTGRES_PASSWORD: eudora
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eudora -d eudora"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-18-data:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://eudora:eudora@postgres:5432/eudora?schema=public
      API_PORT: "3001"
      CORS_ORIGIN: http://localhost:3000,http://localhost:3002
      NODE_ENV: development
      SEED_SUPERADMIN_EMAIL: admin@example.com
      SEED_SUPERADMIN_PASSWORD: AdminPass123!
      SEED_SUPERADMIN_NAME: Super Admin
      SEED_EDUCATION_DEMO: "true"
      SEED_DEMO_GUARDIAN_EMAIL: guardian.demo@example.edu
      SEED_DEMO_GUARDIAN_PASSWORD: GuardianPass123!
      TURBO_TELEMETRY_DISABLED: "1"
    ports:
      - "3001:3001"
    volumes:
      - .:/workspace
      - app-node-modules:/workspace/node_modules
      - app-api-node-modules:/workspace/apps/api/node_modules
      - app-web-node-modules:/workspace/apps/web/node_modules
      - app-console-node-modules:/workspace/apps/console/node_modules
      - app-api-client-node-modules:/workspace/packages/api-client/node_modules
      - app-config-node-modules:/workspace/packages/config/node_modules
      - app-db-node-modules:/workspace/packages/db/node_modules
      - app-turbo-cache:/workspace/.turbo
      - pnpm-store:/pnpm/store
    command: >
      sh -lc "corepack enable &&
      corepack pnpm config set store-dir /pnpm/store &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm corepack:shim &&
      export PATH=/workspace/node_modules/.bin:$$PATH &&
      corepack pnpm db:generate &&
      corepack pnpm db:push &&
      corepack pnpm --filter @eudora/db seed &&
      corepack pnpm --filter @eudora/api dev"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /workspace
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
      - app-node-modules:/workspace/node_modules
      - app-api-node-modules:/workspace/apps/api/node_modules
      - app-web-node-modules:/workspace/apps/web/node_modules
      - app-console-node-modules:/workspace/apps/console/node_modules
      - app-api-client-node-modules:/workspace/packages/api-client/node_modules
      - app-config-node-modules:/workspace/packages/config/node_modules
      - app-db-node-modules:/workspace/packages/db/node_modules
      - app-turbo-cache:/workspace/.turbo
      - pnpm-store:/pnpm/store
    command: >
      sh -lc "corepack enable &&
      corepack pnpm config set store-dir /pnpm/store &&
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm corepack:shim &&
      export PATH=/workspace/node_modules/.bin:$$PATH &&
      corepack pnpm --filter @eudora/web dev:docker"

  console:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    working_dir: /workspace
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    ports:
      - "3002:3000"
    volumes:
      - .:/workspace
      - app-node-modules:/workspace/node_modules
      - app-api-node-modules:/workspace/apps/api/node_modules
      - app-web-node-modules:/workspace/apps/web/node_modules
      - app-console-node-modules:/workspace/apps/console/node_modules
      - app-api-client-node-modules:/workspace/packages/api-client/node_modules
      - app-config-node-modules:/workspace/packages/config/node_modules
      - app-db-node-modules:/workspace/packages/db/node_modules
      - app-turbo-cache:/workspace/.turbo
      - pnpm-store:/pnpm/store
    command: >
      sh -lc "corepack enable &&
      corepack pnpm config set store-dir /pnpm/store &&
      if [ ! -x /workspace/apps/console/node_modules/.bin/next ]; then
        rm -f /workspace/node_modules/.pnpm-workspace-state-v1.json &&
        CI=true corepack pnpm install --frozen-lockfile;
      else
        corepack pnpm install --frozen-lockfile;
      fi &&
      corepack pnpm corepack:shim &&
      export PATH=/workspace/node_modules/.bin:$$PATH &&
      corepack pnpm --filter @pik-pixel/console dev:docker"

volumes:
  postgres-18-data:
  app-node-modules:
  app-api-node-modules:
  app-web-node-modules:
  app-console-node-modules:
  app-api-client-node-modules:
  app-config-node-modules:
  app-db-node-modules:
  app-turbo-cache:
  pnpm-store:
